name: Ubuntu GUI in Browser (NoVNC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Desktop + VNC + NoVNC
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tightvncserver git curl python3

      - name: Setup VNC
        run: |
          mkdir -p ~/.vnc
          echo "password" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/bash
          startxfce4 &
          EOF

          chmod +x ~/.vnc/xstartup

      - name: Start VNC Server
        run: |
          vncserver :1 -geometry 1280x720 -depth 24

      - name: Install NoVNC
        run: |
          git clone https://github.com/novnc/noVNC.git
          git clone https://github.com/novnc/websockify.git
          ln -s noVNC/vnc.html noVNC/index.html

      - name: Start NoVNC (Web VNC)
        run: |
          ./noVNC/utils/novnc_proxy --vnc localhost:5901 --listen 6080 > novnc.log 2>&1 &
          sleep 5

      - name: Install Cloudflared
        run: |
          curl -L https://github
