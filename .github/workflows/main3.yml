name: Ubuntu GUI via Browser (NoVNC + Cloudflare)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Update system
        run: |
          sudo apt update

      - name: Install Desktop + VNC
        run: |
          sudo apt install -y xfce4 xfce4-goodies tightvncserver git python3 curl

      - name: Setup VNC
        run: |
          mkdir -p ~/.vnc
          echo "password" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/bash
          xrdb $HOME/.Xresources
          startxfce4 &
          EOF

          chmod +x ~/.vnc/xstartup

      - name: Start VNC Server
        run: |
          vncserver :1 -geometry 1280x720 -depth 24

      - name: Install NoVNC
        run: |
          git clone https://github.com/novnc/noVNC.git
          git clone https://github.com/novnc/websockify.git
          ln -s noVNC/vnc.html noVNC/index.html

      - name: Start NoVNC
        run: |
          ./noVNC/utils/novnc_proxy --vnc localhost:5901 --listen 6080 > novnc.log 2>&1 &
          sleep 5

      - name: Install Cloudflared (FIXED)
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start Cloudflare Tunnel (GET URL HERE)
        run: |
          ./cloudflared tunnel --url http://localhost:6080 > tunnel.log 2>&1 &
          sleep 10
          cat tunnel.log

      - name: Keep Alive (6 hours)
        run: sleep 21600
